name: Build Poco

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.0

      # The project may sit in the repo root, in a subfolder, or be uploaded as a .zip - find it either way.
      - name: Locate project
        run: |
          set -e
          if [ ! -f build.gradle ] && [ -z "$(find . -name build.gradle -not -path './.git/*' -print -quit)" ]; then
            ZIP="$(find . -maxdepth 2 -name '*.zip' -not -path './.git/*' | head -n 1)"
            if [ -n "$ZIP" ]; then
              echo "Unpacking $ZIP"
              mkdir -p build-src
              unzip -q -o "$ZIP" -d build-src
            fi
          fi
          GRADLE_FILE="$(find . -name build.gradle -not -path './.git/*' -not -path '*/build/*' | awk '{ print length, $0 }' | sort -n | head -n 1 | cut -d' ' -f2-)"
          if [ -z "$GRADLE_FILE" ]; then
            echo "No build.gradle found anywhere in the repository"
            find . -maxdepth 3 -not -path './.git/*' | head -50
            exit 1
          fi
          SRC="$(dirname "$GRADLE_FILE")"
          echo "Project directory: $SRC"
          echo "SRC=$SRC" >> "$GITHUB_ENV"

      - name: Build
        run: |
          cd "$SRC"
          gradle build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: poco
          path: |
            ${{ env.SRC }}/build/libs/*.jar
            !${{ env.SRC }}/build/libs/*-sources.jar
          if-no-files-found: error

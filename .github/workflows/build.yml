name: Build Noon

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (contains noon-source.zip)
        uses: actions/checkout@v4

      - name: Extract source zip
        run: |
          mkdir -p build-src
          unzip -q noon-source.zip -d build-src
          if [ -f build-src/build.gradle ]; then
            echo "SRC=build-src" >> "$GITHUB_ENV"
          else
            d=$(find build-src -maxdepth 2 -name build.gradle -printf '%h\n' | head -n1)
            echo "SRC=$d" >> "$GITHUB_ENV"
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.0

      - name: Build jar
        run: |
          cd "$SRC"
          gradle build --no-daemon --stacktrace

      - name: Collect jar
        run: |
          mkdir -p out
          cp "$SRC"/build/libs/noon-*.jar out/
          rm -f out/*-sources.jar
          ls -l out

      - name: Upload Noon jar
        uses: actions/upload-artifact@v4
        with:
          name: Noon-1.21.11
          path: out/*.jar
